<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Mobile - Premium Bill Book</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --main: #1e3c72; --gold: #d4af37; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; color: #333; }
        .header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 25px; text-align: center; border-bottom: 4px solid var(--gold); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .container { max-width: 700px; margin: 20px auto; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h3 { color: var(--main); border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        label { font-size: 12px; font-weight: bold; text-transform: uppercase; color: #666; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #dde; border-radius: 8px; box-sizing: border-box; font-size: 15px; margin-top: 5px; }
        input:focus { border-color: var(--main); outline: none; box-shadow: 0 0 5px rgba(30,60,114,0.2); }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; text-transform: uppercase; }
        .btn-print { background: var(--main); color: white; }
        .btn-wa { background: #25d366; color: white; }
        .btn-mail { background: #d93025; color: white; margin-top: 30px; }
        #balanceDisplay { text-align: center; font-size: 20px; font-weight: bold; color: #b21f1f; padding: 10px; background: #fff5f5; border-radius: 8px; }
        .search-box { background: #eef2f7; border-left: 5px solid var(--gold); }
        @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0; font-size: 28px;">NOVA MOBILE WORLD</h1>
    <p id="dt" style="margin:5px 0 0; font-size: 14px; opacity: 0.9;"></p>
</div>

<div class="container">
    <div class="card">
        <h3>📄 Create New Bill</h3>
        <div class="row">
            <div>
                <label>Customer Name</label>
                <input type="text" id="cName" placeholder="Enter Full Name">
            </div>
            <div>
                <label>WhatsApp Number (10 Digits)</label>
                <input type="number" id="cPhone" oninput="if(this.value.length > 10) this.value = this.value.slice(0, 10);">
            </div>
        </div>

        <div class="row">
            <div>
                <label>Device Name & Model</label>
                <input type="text" id="dName" placeholder="e.g. Vivo V29 Blue">
            </div>
            <div>
                <label>IMEI / Serial No (Max 18)</label>
                <input type="number" id="imei" oninput="if(this.value.length > 18) this.value = this.value.slice(0, 18);">
            </div>
        </div>

        <div class="row">
            <div>
                <label>Total Price (₹)</label>
                <input type="number" id="tPrice" onkeyup="updateBal()">
            </div>
            <div>
                <label>Discount (₹) - Optional</label>
                <input type="number" id="disc" onkeyup="updateBal()" value="0">
            </div>
        </div>

        <div class="row">
            <div>
                <label>Advance Paid (₹)</label>
                <input type="number" id="paid" onkeyup="updateBal()">
            </div>
            <div>
                <label>Payment Status</label>
                <select id="pStatus">
                    <option value="Full Paid">Full Paid ✅</option>
                    <option value="Udhari / Pending">Udhari / Pending ⏳</option>
                </select>
            </div>
        </div>

        <div id="balanceDisplay">Balance: ₹0</div>

        <button class="btn btn-print" onclick="handleBill('pdf')">💾 Save & Download PDF</button>
        <button class="btn btn-wa" onclick="handleBill('wa')">📲 Share on WhatsApp</button>
    </div>

    <div class="card search-box">
        <h3>🔍 Udhari Ledger / History</h3>
        <input type="text" id="search" placeholder="Search by Name or Number..." onkeyup="searchLogs()">
        <div id="logList" style="margin-top:15px; font-size:14px;"></div>
    </div>

    <button class="btn btn-mail" onclick="sendBackup()">📤 Send Data Backup to My Gmail</button>
    <p style="text-align:center; font-size:11px; color:#777;">Data is saved locally in this device only.</p>
</div>

<script>
    document.getElementById('dt').innerText = new Date().toDateString();

    function updateBal() {
        let t = parseFloat(document.getElementById('tPrice').value) || 0;
        let d = parseFloat(document.getElementById('disc').value) || 0;
        let p = parseFloat(document.getElementById('paid').value) || 0;
        let b = (t - d) - p;
        document.getElementById('balanceDisplay').innerText = "Balance: ₹" + (b > 0 ? b : 0);
    }

    async function handleBill(mode) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        const data = {
            name: document.getElementById('cName').value,
            phone: document.getElementById('cPhone').value,
            dev: document.getElementById('dName').value,
            imei: document.getElementById('imei').value,
            total: document.getElementById('tPrice').value,
            disc: document.getElementById('disc').value,
            paid: document.getElementById('paid').value,
            status: document.getElementById('pStatus').value,
            date: new Date().toLocaleString()
        };

        if(!data.name || !data.total) return alert("Please enter Name and Price!");

        // Save to Phone Memory
        let allBills = JSON.parse(localStorage.getItem('nova_data')) || [];
        allBills.push(data);
        localStorage.setItem('nova_data', JSON.stringify(allBills));

        if(mode === 'pdf') {
            doc.setFillColor(30, 60, 114);
            doc.rect(0, 0, 210, 40, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(22);
            doc.text("NOVA MOBILE WORLD", 105, 25, {align: 'center'});
            
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(12);
            doc.text(`Date: ${data.date}`, 140, 50);
            doc.text(`Bill To: ${data.name} (${data.phone})`, 20, 70);
            doc.line(20, 75, 190, 75);
            
            doc.text(`Device: ${data.dev}`, 20, 90);
            doc.text(`IMEI: ${data.imei}`, 20, 100);
            doc.text(`Price: Rs. ${data.total}`, 20, 110);
            doc.text(`Discount: Rs. ${data.disc}`, 20, 120);
            doc.text(`Paid: Rs. ${data.paid}`, 20, 130);
            doc.setFontSize(14);
            doc.text(`Status: ${data.status}`, 20, 150);
            
            doc.setFontSize(10);
            doc.text("____________________", 20, 210); doc.text("Owner Signature", 25, 218);
            doc.text("____________________", 140, 210); doc.text("Customer Signature", 145, 218);
            
            doc.save(`${data.name}_Bill.pdf`);
        } else {
            let msg = `*NOVA MOBILE WORLD*%0A--------------------------%0A*Name:* ${data.name}%0A*Device:* ${data.dev}%0A*Price:* ₹${data.total}%0A*Status:* ${data.status}%0A--------------------------%0A*Thank You!*`;
            window.open(`https://wa.me/91${data.phone}?text=${msg}`, '_blank');
        }
    }

    function searchLogs() {
        let s = document.getElementById('search').value.toLowerCase();
        let bills = JSON.parse(localStorage.getItem('nova_data')) || [];
        let html = "";
        bills.filter(b => b.name.toLowerCase().includes(s) || b.phone.includes(s)).forEach(b => {
            html += `<div style="border-bottom:1px solid #ddd; padding:8px 0;">
                <b>${b.name}</b> (${b.phone})<br>
                ${b.dev} | <span style="color:red">₹${b.total - b.disc - b.paid} Bal.</span>
            </div>`;
        });
        document.getElementById('logList').innerHTML = html;
    }

    function sendBackup() {
        let data = localStorage.getItem('nova_data');
        let email = "owner_email@gmail.com"; // Change this
        window.location.href = `mailto:${email}?subject=Mobile Shop Backup ${new Date().toLocaleDateString()}&body=Backup Data: %0A%0A${data}`;
    }
</script>

</body>
</html>
