<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Shop - Bill & Udhari</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #eef2f3; }
        .header { background: #2c3e50; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .search-box { background: #fff; border-left: 5px solid #2980b9; }
        .bill-list { margin-top: 10px; font-size: 14px; color: #333; }
        .item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="header">📱 Mobile Shop Digital Book</div>

<div class="container">
    <div class="card">
        <h3>Naya Bill / Udhari</h3>
        <input type="text" id="custName" placeholder="Customer ka Naam">
        <input type="text" id="itemName" placeholder="Mobile / Item ka Naam">
        <input type="number" id="price" placeholder="Total Amount (₹)">
        <button onclick="saveAndPrint()">Save Karein & PDF Nikalein</button>
    </div>

    <div class="card search-box">
        <h3>Udhari Check Karein</h3>
        <input type="text" id="searchName" placeholder="Customer ka naam likhein..." onkeyup="searchCustomer()">
        <div id="resultArea" class="bill-list"></div>
    </div>
</div>

<script>
    const { jsPDF } = window.jspdf;

    // Data Save karne ke liye
    function saveAndPrint() {
        const name = document.getElementById('custName').value;
        const item = document.getElementById('itemName').value;
        const price = document.getElementById('price').value;

        if(!name || !price) { alert("Naam aur Amount zaroori hai!"); return; }

        const billData = { item, price, date: new Date().toLocaleDateString() };
        
        // Browser memory mein save karna
        let history = JSON.parse(localStorage.getItem(name)) || [];
        history.push(billData);
        localStorage.setItem(name, JSON.stringify(history));

        // PDF Banana
        const doc = new jsPDF();
        doc.text("Mobile Shop Bill", 20, 20);
        doc.text(`Customer: ${name}`, 20, 40);
        doc.text(`Item: ${item}`, 20, 50);
        doc.text(`Total Amount: Rs. ${price}`, 20, 60);
        doc.text(`Date: ${billData.date}`, 20, 70);
        doc.save(`${name}_bill.pdf`);

        alert("Data save ho gaya aur PDF download ho rahi hai!");
        location.reload();
    }

    // Search karne ke liye
    function searchCustomer() {
        const sName = document.getElementById('searchName').value;
        const resultArea = document.getElementById('resultArea');
        resultArea.innerHTML = "";

        if(sName.length < 1) return;

        // Local storage se dhundna
        for (let i = 0; i < localStorage.length; i++){
            let key = localStorage.key(i);
            if(key.toLowerCase().includes(sName.toLowerCase())){
                let data = JSON.parse(localStorage.getItem(key));
                data.forEach(bill => {
                    resultArea.innerHTML += `<div class="item">
                        <span><b>${key}</b> (${bill.date})</span>
                        <span style="color:red">₹${bill.price}</span>
                    </div>`;
                });
            }
        }
    }
</script>

</body>
</html>
