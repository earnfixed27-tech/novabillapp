<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Billing - Nova Digital</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #00427c; --secondary: #cfa144; --bg: #f4f7fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; }
        .header { background: var(--primary); color: white; padding: 35px 20px; text-align: center; border-bottom: 5px solid var(--secondary); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .container { max-width: 850px; margin: 20px auto; padding: 15px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        label { font-size: 13px; font-weight: 700; color: #444; text-transform: uppercase; margin-bottom: 5px; display: block; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 15px; transition: 0.3s; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 10px rgba(0,66,124,0.1); }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 17px; margin-top: 10px; transition: 0.3s; text-transform: uppercase; }
        .btn-main { background: var(--primary); color: white; }
        .btn-wa { background: #25d366; color: white; }
        .calc-badge { background: #eef5ff; border: 2px dashed var(--primary); padding: 20px; border-radius: 12px; text-align: center; margin: 20px 0; }
        #finalAmt { font-size: 24px; color: #b91c1c; font-weight: 900; }
        .other-brand { display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0; font-size: 32px; letter-spacing: 2px;">NOVA DIGITAL ENTERPRISE</h1>
    <p style="margin:5px 0 0; opacity: 0.8;">Certified Official Partner Store</p>
</div>

<div class="container">
    <div class="card">
        <h3>👤 Customer & Store Details</h3>
        <div class="grid">
            <div>
                <label>Customer Name</label>
                <input type="text" id="custName" placeholder="Full Name">
            </div>
            <div>
                <label>WhatsApp Number</label>
                <input type="number" id="custPhone" oninput="if(this.value.length > 10) this.value = this.value.slice(0, 10);">
            </div>
        </div>
        <div class="grid">
            <div>
                <label>GSTIN (Optional)</label>
                <input type="text" id="gstIn" placeholder="22AAAAA0000A1Z5">
            </div>
            <div>
                <label>Official Store Email</label>
                <input type="email" id="ownerEmail" placeholder="backup@gmail.com">
            </div>
        </div>
    </div>

    <div class="card">
        <h3>📱 Product Information</h3>
        <div class="grid">
            <div>
                <label>Select Brand</label>
                <select id="brand" onchange="checkOther()">
                    <option value="iPhone">Apple iPhone</option>
                    <option value="Samsung">Samsung</option>
                    <option value="Vivo">Vivo</option>
                    <option value="Oppo">Oppo</option>
                    <option value="Realme">Realme</option>
                    <option value="Other">Other Brand</option>
                </select>
                <input type="text" id="otherBrand" class="other-brand" placeholder="Write Brand Name">
            </div>
            <div>
                <label>Model Name</label>
                <input type="text" id="model" placeholder="e.g. Galaxy S24 Ultra">
            </div>
        </div>
        <div class="grid">
            <div>
                <label>IMEI / Serial No.</label>
                <input type="number" id="imei" oninput="if(this.value.length > 18) this.value = this.value.slice(0, 18);">
            </div>
            <div>
                <label>Payment Mode</label>
                <select id="payMode">
                    <option value="Cash">Cash</option>
                    <option value="UPI / Online">UPI / Online</option>
                    <option value="Finance / EMI">Finance / EMI</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>💰 Calculator & Offers</h3>
        <div class="grid">
            <div>
                <label>M.R.P Price (₹)</label>
                <input type="number" id="mrp" onkeyup="smartCalc()" placeholder="0.00">
            </div>
            <div>
                <label>Special Offer (%)</label>
                <select id="discPerc" onchange="smartCalc()">
                    <option value="0">0% (No Offer)</option>
                    <option value="2">2% Corporate Discount</option>
                    <option value="5">5% Seasonal Offer</option>
                    <option value="10">10% Mega Sale</option>
                </select>
            </div>
        </div>
        <div class="grid">
            <div>
                <label>Advance Paid (₹)</label>
                <input type="number" id="paid" onkeyup="smartCalc()" placeholder="0.00">
            </div>
            <div>
                <label>Status</label>
                <select id="status">
                    <option value="PAID">Full Payment ✅</option>
                    <option value="DUE">Payment Pending ⏳</option>
                </select>
            </div>
        </div>
        <div class="calc-badge">
            <div id="finalAmt">Balance Due: ₹0</div>
        </div>
        <button class="btn btn-main" onclick="generateInvoice('pdf')">Generate Official Invoice</button>
        <button class="btn btn-wa" onclick="generateInvoice('wa')">Share on WhatsApp</button>
    </div>
</div>

<script>
    function checkOther() {
        let b = document.getElementById('brand').value;
        document.getElementById('otherBrand').style.display = (b === 'Other') ? 'block' : 'none';
    }

    function smartCalc() {
        let mrp = parseFloat(document.getElementById('mrp').value) || 0;
        let perc = parseFloat(document.getElementById('discPerc').value) || 0;
        let paid = parseFloat(document.getElementById('paid').value) || 0;
        
        let discAmt = (mrp * perc) / 100;
        let total = mrp - discAmt;
        let due = total - paid;
        
        document.getElementById('finalAmt').innerText = "Balance Due: ₹" + (due > 0 ? due.toFixed(2) : 0);
    }

    async function generateInvoice(mode) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        const info = {
            name: document.getElementById('custName').value,
            phone: document.getElementById('custPhone').value,
            brand: document.getElementById('brand').value === 'Other' ? document.getElementById('otherBrand').value : document.getElementById('brand').value,
            model: document.getElementById('model').value,
            imei: document.getElementById('imei').value,
            mrp: parseFloat(document.getElementById('mrp').value) || 0,
            disc: parseFloat(document.getElementById('discPerc').value) || 0,
            paid: parseFloat(document.getElementById('paid').value) || 0,
            gst: document.getElementById('gstIn').value,
            status: document.getElementById('status').value,
            date: new Date().toLocaleString()
        };

        if(!info.name || !info.mrp) return alert("Please fill basic details!");

        if(mode === 'pdf') {
            // Background Watermark Pattern
            doc.setTextColor(245, 245, 245);
            doc.setFontSize(40);
            for(let i=0; i<8; i++) doc.text("NOVA DIGITAL STORE", 10, i*40, {angle: 30});

            // Corporate Header
            doc.setFillColor(0, 66, 124); // Samsung Blue
            doc.rect(0, 0, 210, 50, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(26); doc.setFont("helvetica", "bold");
            doc.text(info.brand.toUpperCase() + " AUTHORIZED STORE", 105, 25, {align: 'center'});
            doc.setFontSize(10); doc.setFont("helvetica", "normal");
            doc.text("Official Tax Invoice | Enterprise System", 105, 35, {align: 'center'});

            // Bill Info
            doc.setTextColor(0,0,0);
            doc.setFontSize(10);
            doc.text(`Invoice: #NV-${Math.floor(Math.random()*900000)}`, 20, 65);
            doc.text(`Date: ${info.date}`, 140, 65);
            doc.line(20, 70, 190, 70);

            // Table Header
            doc.setFillColor(230, 230, 230);
            doc.rect(20, 80, 170, 10, 'F');
            doc.text("Description", 25, 87); doc.text("Details", 120, 87);

            // Product Details
            let y = 100;
            doc.text(`Customer Name:`, 25, y); doc.text(info.name, 120, y); y+=10;
            doc.text(`Mobile Device:`, 25, y); doc.text(`${info.brand} ${info.model}`, 120, y); y+=10;
            if(info.imei) { doc.text(`IMEI/Serial:`, 25, y); doc.text(info.imei, 120, y); y+=10; }
            if(info.gst) { doc.text(`Customer GSTIN:`, 25, y); doc.text(info.gst, 120, y); y+=10; }

            // Calculation Box
            y += 10;
            doc.setDrawColor(0, 66, 124); doc.setLineWidth(0.5);
            doc.rect(110, y, 80, 45);
            doc.text(`Sub Total:`, 115, y+10); doc.text(`Rs. ${info.mrp}`, 160, y+10);
            doc.text(`Discount (${info.disc}%):`, 115, y+20); doc.text(`- Rs. ${(info.mrp*info.disc/100)}`, 160, y+20);
            doc.text(`Advance Paid:`, 115, y+30); doc.text(`Rs. ${info.paid}`, 160, y+30);
            
            doc.setFontSize(12); doc.setFont("helvetica", "bold");
            let final = (info.mrp - (info.mrp*info.disc/100)) - info.paid;
            doc.text(`BALANCE:`, 115, y+40); doc.text(`Rs. ${final.toFixed(2)}`, 160, y+40);

            // Status Stamp
            if(final <= 0) {
                doc.setDrawColor(0, 128, 0); doc.setTextColor(0, 128, 0);
                doc.rect(20, y+10, 60, 20); doc.text("FULLY PAID ✅", 25, y+22);
            } else {
                doc.setDrawColor(200, 0, 0); doc.setTextColor(200, 0, 0);
                doc.rect(20, y+10, 60, 20); doc.text("PAYMENT DUE ⏳", 25, y+22);
            }

            // Footer
            doc.setTextColor(100, 100, 100); doc.setFontSize(8);
            doc.text("Terms: No return after 7 days. Warranty as per brand policy.", 105, 280, {align: 'center'});
            doc.text("This is an electronically generated document.", 105, 285, {align: 'center'});

            doc.save(`${info.name}_Invoice.pdf`);
        } else {
            let msg = `*${info.brand.toUpperCase()} OFFICIAL BILL*%0A---%0A*Name:* ${info.name}%0A*Device:* ${info.brand} ${info.model}%0A*Total:* ₹${info.mrp - (info.mrp*info.disc/100)}%0A*Status:* ${info.status}%0A---%0A_Powered by Nova Enterprise_`;
            window.open(`https://wa.me/91${info.phone}?text=${msg}`, '_blank');
        }
    }
</script>

</body>
</html>
