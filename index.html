<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Enterprise - Smart Billing</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --brand: #0f172a; --gold: #ca8a04; --accent: #3b82f6; }
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; margin: 0; color: #1e293b; }
        .header { background: var(--brand); color: white; padding: 30px 20px; text-align: center; border-bottom: 5px solid var(--gold); }
        .container { max-width: 800px; margin: 20px auto; padding: 10px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        label { font-size: 12px; font-weight: bold; color: #64748b; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 15px; margin-top: 5px; box-sizing: border-box; }
        .calc-box { background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; margin: 15px 0; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn-main { background: var(--brand); color: white; }
        .btn-wa { background: #22c55e; color: white; }
        #finalDisplay { text-align: center; font-size: 22px; font-weight: 800; color: #b91c1c; padding: 15px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0; letter-spacing: 1px;">NOVA DIGITAL STORE</h1>
    <p style="opacity:0.8; font-size: 13px;">Premium Smart Billing System</p>
</div>

<div class="container">
    <div class="card">
        <div class="grid">
            <div>
                <label>Customer Name</label>
                <input type="text" id="cName" placeholder="Full Name">
            </div>
            <div>
                <label>WhatsApp No.</label>
                <input type="number" id="cPhone" oninput="if(this.value.length > 10) this.value = this.value.slice(0, 10);">
            </div>
        </div>

        <div class="grid">
            <div>
                <label>Device / Model</label>
                <input type="text" id="model" placeholder="Model Name">
            </div>
            <div>
                <label>IMEI / Serial No.</label>
                <input type="number" id="imei" oninput="if(this.value.length > 18) this.value = this.value.slice(0, 18);">
            </div>
        </div>

        <div>
            <label>GST No. (Optional)</label>
            <input type="text" id="gst" placeholder="GSTIN Number">
        </div>

        <div class="calc-box">
            <div class="grid">
                <div>
                    <label>Amount (₹)</label>
                    <input type="number" id="basePrice" onkeyup="smartCalc()" placeholder="0">
                </div>
                <div>
                    <label>Discount (%)</label>
                    <select id="discPerc" onchange="smartCalc()">
                        <option value="0">0% No Discount</option>
                        <option value="2">2% Off</option>
                        <option value="5">5% Off</option>
                        <option value="10">10% Off</option>
                    </select>
                </div>
            </div>
            <div class="grid">
                <div>
                    <label>Discount Value (₹)</label>
                    <input type="number" id="discVal" onkeyup="smartCalc()" placeholder="Manual Discount">
                </div>
                <div>
                    <label>Advance Paid (₹)</label>
                    <input type="number" id="paid" onkeyup="smartCalc()" placeholder="0">
                </div>
            </div>
            <div id="finalDisplay">Balance: ₹0</div>
        </div>

        <button class="btn btn-main" onclick="generate('pdf')">Download Official PDF</button>
        <button class="btn btn-wa" onclick="generate('wa')">Share on WhatsApp</button>
    </div>

    <div class="card" style="background: #f1f5f9;">
        <h3>
