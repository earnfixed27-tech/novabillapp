<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="display" content="standalone">

    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22NovaBillPro%22,%22short_name%22:%22NovaBill%22,%22start_url%22:%22index.html%22,%22display%22:%22standalone%22,%22background_color%22:%22#001f3f%22,%22theme_color%22:%22#001f3f%22}">

    <title>Nova Bill Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --main: #001f3f; --gold: #c5a059; }
        body { font-family: sans-serif; margin: 0; background: #f0f4f8; height: 100vh; overflow: hidden; }
        .header { background: var(--main); color: white; padding: 20px; text-align: center; border-bottom: 5px solid var(--gold); padding-top: env(safe-area-inset-top); }
        #loginScreen { position: fixed; inset: 0; background: var(--main); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 280px; text-align: center; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; background: var(--main); color: white; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <h2 style="color:var(--main)">OWNER LOGIN</h2>
        <input type="text" id="user" placeholder="Shop ID" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ccc;">
        <input type="password" id="pass" placeholder="Password" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ccc;">
        <button class="btn" onclick="handleLogin()">Login & Install App</button>
    </div>
</div>

<div id="mainApp" style="display:none; flex-direction:column; height:100vh;">
    <div class="header">
        <h1 id="shopDisp" style="margin:0; font-size: 20px;">SHOP NAME</h1>
    </div>
    <div style="padding:20px; flex:1; overflow-y:auto;">
        <h3>Add to Home Screen kelya nantar link disnar nahi!</h3>
        </div>
</div>

<script>
    // Service Worker Trick (Browser la App banvnyasathi majbur karnyasathi)
    if ('serviceWorker' in navigator) {
        const sw = 'self.addEventListener("fetch", (e) => { e.respondWith(fetch(e.request)); });';
        const blob = new Blob([sw], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob));
    }

    const stores = { "nova1": { name: "NOVA DIGITAL WORLD", pass: "nova123" } };

    function handleLogin() {
        let u = document.getElementById('user').value, p = document.getElementById('pass').value;
        if(stores[u] && stores[u].pass === p) { localStorage.setItem('session', u); login(u); } 
        else { alert("Wrong ID/Pass"); }
    }

    function login(u) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        document.getElementById('shopDisp').innerText = stores[u].name;
    }

    window.onload = () => { if(localStorage.getItem('session')) login(localStorage.getItem('session')); };
</script>
</body>
</html>
