<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NovaBill">
    
    <title>Nova Enterprise Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22NovaBillPro%22,%22short_name%22:%22NovaBill%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#001f3f%22,%22theme_color%22:%22#001f3f%22}">

    <style>
        :root { --main: #001f3f; --gold: #c5a059; --bg: #f0f4f8; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 0;
            /* Full screen setup */
            height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            -webkit-user-select: none;
        }
        
        /* Safe Area for iPhone (Notch area fixing) */
        .header { 
            padding-top: env(safe-area-inset-top); 
            background: var(--main); 
            color: white; 
            text-align: center; 
            padding-bottom: 20px;
            border-bottom: 5px solid var(--gold);
        }

        #loginScreen { 
            position: fixed; 
            inset: 0; 
            background: var(--main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 10000; 
        }
        
        .login-box { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            width: 80%; 
            max-width: 300px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            box-sizing: border-box; 
        }

        .btn { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            background: var(--main); 
            color: white; 
            text-transform: uppercase;
        }

        #mainApp { display: none; }
        .container { padding: 15px; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <h2 style="color:var(--main); margin-top:0;">ENTER APP</h2>
        <input type="text" id="user" placeholder="Shop ID">
        <input type="password" id="pass" placeholder="Password">
        <button class="btn" onclick="handleLogin()">Login & Start App</button>
    </div>
</div>

<div id="mainApp">
    <div class="header">
        <h2 id="displayShopName" style="margin-bottom:0;">NOVA DIGITAL</h2>
        <small id="liveClock" style="color:var(--gold)"></small>
    </div>
    <div class="container">
        <div class="card">
            <input type="text" id="cName" placeholder="Customer Name">
            <input type="number" id="cPhone" placeholder="WhatsApp Number">
            <textarea id="cAddr" placeholder="Customer Address"></textarea>
            <input type="number" id="mrp" placeholder="Price (₹)">
            <button class="btn" style="background:#2b9348;" onclick="save()">Print Bill</button>
        </div>
    </div>
</div>

<script>
    // Config
    const stores = { "nova1": { name: "NOVA DIGITAL WORLD", pass: "nova123" } };

    window.onload = () => {
        if(localStorage.getItem('session')) login(localStorage.getItem('session'));
    };

    function handleLogin() {
        let u = document.getElementById('user').value;
        let p = document.getElementById('pass').value;
        if(stores[u] && stores[u].pass === p) {
            localStorage.setItem('session', u);
            login(u);
        } else { alert("Wrong ID/Pass"); }
    }

    function login(u) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('displayShopName').innerText = stores[u].name;
        setInterval(()=> { document.getElementById('liveClock').innerText = new Date().toLocaleString(); }, 1000);
    }
    
    function save() { alert("Bill Saved!"); }
</script>
</body>
</html>
