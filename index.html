<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Billing - EMI & Ledger Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script> 
    <style>
        :root { --main: #001f3f; --gold: #c5a059; --bg: #f4f7f9; --red: #d90429; --green: #2b9348; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        #loginScreen { position: fixed; inset: 0; background: #001f3f; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 40px; border-radius: 20px; width: 350px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border-top: 8px solid var(--gold); }
        #mainApp { display: none; }
        .header { background: #001f3f; color: white; padding: 20px; text-align: center; border-bottom: 5px solid var(--gold); }
        #liveClock { font-size: 16px; color: var(--gold); font-weight: bold; margin-top: 5px; }
        .container { max-width: 900px; margin: 10px auto; padding: 15px; }
        .card { background: white; padding: 25px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #ddd; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; }
        .btn-blue { background: #001f3f; color: white; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #ddd; }
        .tab-btn.active { background: #001f3f; color: white; }
        
        /* EMI List Styles */
        .ledger-row { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; border-left: 6px solid #ddd; transition: 0.3s; }
        .status-tag { padding: 4px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .tag-pending { background: #ffe3e3; color: var(--red); }
        .tag-success { background: #e3ffe3; color: var(--green); }
        .history-item { font-size: 12px; padding: 5px 0; border-bottom: 1px dashed #eee; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <h2 style="color:#001f3f;">STORE LOGIN</h2>
        <input type="text" id="user" placeholder="Shop ID">
        <input type="password" id="pass" placeholder="Password">
        <button class="btn btn-blue" onclick="handleLogin()">Login</button>
    </div>
</div>

<div id="mainApp">
    <div class="header">
        <h1 id="displayShopName" style="margin:0;">SHOP NAME</h1>
        <div id="liveClock">Loading Time...</div>
    </div>

    <div class="container">
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button class="tab-btn active" id="tab1" onclick="switchTab('billing')">New Bill</button>
            <button class="tab-btn" id="tab2" onclick="switchTab('ledger')">EMI Ledger (History)</button>
        </div>

        <div id="billingPage">
            <div class="card">
                <h3>Customer & Product</h3>
                <div class="grid">
                    <input type="text" id="cName" placeholder="Customer Name">
                    <input type="number" id="cPhone" placeholder="WhatsApp No.">
                </div>
                <div class="grid">
                    <select id="brand"><option>Samsung</option><option>iPhone</option><option>Vivo</option><option>Oppo</option><option>Realme</option></select>
                    <input type="text" id="model" placeholder="Model Name">
                </div>
                <input type="number" id="imei" placeholder="IMEI Number">
                <input type="number" id="mrp" placeholder="Total Price (₹)">
                <input type="number" id="paid" placeholder="Advance Paid (₹)">
                <input type="number" id="warranty" value="12" placeholder="Warranty Months">
                <button class="btn btn-blue" onclick="generateNewBill()">Create & Print First Bill</button>
            </div>
        </div>

        <div id="ledgerPage" style="display:none;">
            <div class="card">
                <input type="text" id="search" placeholder="Search Customer..." onkeyup="loadLedger()">
                <div id="ledgerList"></div>
            </div>
        </div>
    </div>
</div>

<div id="emiModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:10000; overflow-y:auto; padding:20px;">
    <div class="card" style="max-width:500px; margin:auto;">
        <h2 id="modalCustName">Update Payment</h2>
        <div id="emiHistoryArea"></div>
        <hr>
        <label>Add New Installment (EMI)</label>
        <input type="number" id="newEmiAmt" placeholder="Amount (₹)">
        <button class="btn btn-blue" onclick="submitEmi()">Add & Update Balance</button>
        <button class="btn" onclick="document.getElementById('emiModal').style.display='none'">Close</button>
    </div>
</div>

<script>
    const accounts = {
        "nova1": { pass: "nova123", name: "NOVA DIGITAL WORLD", instaID: "novadigital", contactNo: "+91 9876543210", gstNo: "27ABC123" },
        "admin": { pass: "master999", name: "MASTER ADMIN", instaID: "", contactNo: "", gstNo: "" }
    };

    let loggedInUser = "";
    let selectedCustId = null;

    function handleLogin() {
        let u = document.getElementById('user').value;
        let p = document.getElementById('pass').value;
        if (accounts[u] && accounts[u].pass === p) {
            loggedInUser = u;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('displayShopName').innerText = accounts[u].name;
            setInterval(updateClock, 1000);
        } else { alert("Wrong Credentials!"); }
    }

    function updateClock() {
        document.getElementById('liveClock').innerText = new Date().toLocaleString();
    }

    function switchTab(t) {
        document.getElementById('billingPage').style.display = (t === 'billing' ? 'block' : 'none');
        document.getElementById('ledgerPage').style.display = (t === 'ledger' ? 'block' : 'none');
        document.getElementById('tab1').classList.toggle('active', t === 'billing');
        document.getElementById('tab2').classList.toggle('active', t === 'ledger');
        if(t === 'ledger') loadLedger();
    }

    function generateNewBill() {
        let data = {
            id: Date.now(),
            name: document.getElementById('cName').value,
            phone: document.getElementById('cPhone').value,
            brand: document.getElementById('brand').value,
            model: document.getElementById('model').value,
            imei: document.getElementById('imei').value,
            mrp: parseFloat(document.getElementById('mrp').value) || 0,
            warranty: parseInt(document.getElementById('warranty').value) || 0,
            payments: [{ amt: parseFloat(document.getElementById('paid').value) || 0, date: new Date().toLocaleString() }],
            date: new Date().toLocaleString()
        };
        
        if(!data.name || !data.mrp) return alert("Fill Name and Price!");

        let dbKey = "db_v4_" + loggedInUser;
        let db = JSON.parse(localStorage.getItem(dbKey)) || [];
        db.push(data);
        localStorage.setItem(dbKey, JSON.stringify(db));
        
        printBill(data);
        alert("New Bill Saved!");
    }

    function loadLedger() {
        let dbKey = "db_v4_" + loggedInUser;
        let db = JSON.parse(localStorage.getItem(dbKey)) || [];
        let search = document.getElementById('search').value.toLowerCase();
        let list = document.getElementById('ledgerList');
        list.innerHTML = "";

        db.reverse().forEach(cust => {
            if(!cust.name.toLowerCase().includes(search)) return;
            let totalPaid = cust.payments.reduce((sum, p) => sum + p.amt, 0);
            let bal = cust.mrp - totalPaid;
            let status = (bal <= 0) ? 'tag-success' : 'tag-pending';
            let label = (bal <= 0) ? 'Success' : 'Pending';

            list.innerHTML += `
                <div class="ledger-row" style="border-left-color: ${bal <= 0 ? 'var(--green)' : 'var(--red)'}" onclick="openEmiModal(${cust.id})">
                    <div><b>${cust.name}</b><br><small>${cust.brand} ${cust.model}</small></div>
                    <div style="text-align:right">
                        <span class="status-tag ${status}">${label}</span><br>
                        <b>₹${bal} Due</b>
                    </div>
                </div>`;
        });
    }

    function openEmiModal(id) {
        selectedCustId = id;
        let db = JSON.parse(localStorage.getItem("db_v4_" + loggedInUser));
        let cust = db.find(x => x.id === id);
        document.getElementById('modalCustName').innerText = cust.name;
        let histHtml = "<h4>Payment History</h4>";
        let totalPaid = 0;
        cust.payments.forEach(p => {
            histHtml += `<div class="history-item"><span>${p.date}</span> <b>₹${p.amt}</b></div>`;
            totalPaid += p.amt;
        });
        histHtml += `<div style="margin-top:10px; font-weight:bold; color:var(--red);">Total Balance: ₹${cust.mrp - totalPaid}</div>`;
        document.getElementById('emiHistoryArea').innerHTML = histHtml;
        document.getElementById('emiModal').style.display = 'block';
    }

    function submitEmi() {
        let amt = parseFloat(document.getElementById('newEmiAmt').value) || 0;
        if(amt <= 0) return alert("Enter valid amount");

        let dbKey = "db_v4_" + loggedInUser;
        let db = JSON.parse(localStorage.getItem(dbKey));
        let idx = db.findIndex(x => x.id === selectedCustId);
        
        db[idx].payments.push({ amt: amt, date: new Date().toLocaleString() });
        localStorage.setItem(dbKey, JSON.stringify(db));
        
        alert("Payment Updated!");
        document.getElementById('emiModal').style.display = 'none';
        printBill(db[idx]);
        loadLedger();
    }

    async function printBill(cust) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        let shop = accounts[loggedInUser];
        let totalPaid = cust.payments.reduce((sum, p) => sum + p.amt, 0);
        let bal = cust.mrp - totalPaid;

        // Corporate Header
        doc.setFillColor(0, 31, 63); doc.rect(0, 0, 210, 45, 'F');
        doc.setTextColor(197, 160, 89); doc.setFontSize(22); doc.text(shop.name, 105, 20, {align: 'center'});
        doc.setTextColor(255, 255, 255); doc.setFontSize(10); doc.text("DIGITAL TAX INVOICE", 105, 30, {align: 'center'});

        // Customer & Product Info
        doc.setTextColor(0,0,0); doc.setFontSize(10);
        doc.text(`Customer: ${cust.name}`, 20, 60);
        doc.text(`Contact: ${cust.phone}`, 20, 70);
        doc.text(`Handset: ${cust.brand} ${cust.model}`, 20, 80);
        doc.text(`IMEI/SN: ${cust.imei}`, 20, 90);

        // Status Stamp (Green/Red)
        if(bal <= 0) {
            doc.setDrawColor(43, 147, 72); doc.setTextColor(43, 147, 72);
            doc.rect(140, 55, 50, 15); doc.text("SUCCESSFUL ✅", 145, 65);
        } else {
            doc.setDrawColor(217, 4, 41); doc.setTextColor(217, 4, 41);
            doc.rect(140, 55, 50, 15); doc.text("PENDING EMI ⏳", 145, 65);
        }

        doc.setTextColor(0,0,0);
        doc.setFillColor(245, 245, 245); doc.rect(20, 105, 170, 40, 'F');
        doc.text(`Total Price: Rs. ${cust.mrp}`, 25, 115);
        doc.text(`Total Received: Rs. ${totalPaid}`, 25, 125);
        doc.setFontSize(12); doc.text(`BALANCE DUE: Rs. ${bal}`, 25, 137);

        // Signature
        doc.setFontSize(10);
        doc.text("_________________", 20, 260); doc.text("Owner Sign", 25, 270);
        doc.text("_________________", 140, 260); doc.text("Customer Sign", 145, 270);

        doc.save(`${cust.name}_Bill.pdf`);
    }
</script>

</body>
</html>
