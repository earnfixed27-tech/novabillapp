<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#001f3f">
    
    <title>Nova Bill Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>

    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22NovaBillPro%22,%22short_name%22:%22NovaBill%22,%22start_url%22:%22index.html%22,%22display%22:%22standalone%22,%22background_color%22:%22#001f3f%22,%22theme_color%22:%22#001f3f%22}">

    <style>
        :root { --main: #001f3f; --gold: #c5a059; --bg: #f0f4f8; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; width: 100vw; overflow: hidden; }
        
        /* Full Screen Layout */
        #loginScreen { position: fixed; inset: 0; background: var(--main); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 80%; max-width: 320px; text-align: center; }
        
        #mainApp { display: none; height: 100vh; overflow-y: auto; }
        .header { background: var(--main); color: white; padding: 20px; text-align: center; border-bottom: 5px solid var(--gold); padding-top: env(safe-area-inset-top); }
        
        .container { padding: 15px; padding-bottom: 100px; }
        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        input, select, textarea { width: 100%; padding: 12px; border: 1.5px solid #ddd; border-radius: 10px; margin-bottom: 12px; box-sizing: border-box; font-size: 14px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; background: var(--main); color: white; text-transform: uppercase; }
        
        .tab-nav { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #ddd; border-radius: 8px; font-weight: bold; }
        .tab-btn.active { background: var(--main); color: white; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <h2 style="color:var(--main)">STORE LOGIN</h2>
        <input type="text" id="user" placeholder="Shop ID (nova1)">
        <input type="password" id="pass" placeholder="Password (nova123)">
        <button class="btn" onclick="handleLogin()">Login & Install</button>
    </div>
</div>

<div id="mainApp">
    <div class="header">
        <h1 id="displayShopName" style="margin:0; font-size: 20px;">SHOP NAME</h1>
        <div id="liveClock" style="font-size: 11px; color: var(--gold);"></div>
    </div>
    <div class="container">
        <div class="tab-nav">
            <button class="tab-btn active" id="tab1" onclick="switchTab('billing')">Billing</button>
            <button class="tab-btn" id="tab2" onclick="switchTab('ledger')">History</button>
        </div>
        <div id="billingPage">
            <div class="card">
                <input type="text" id="cName" placeholder="Customer Name">
                <input type="number" id="cPhone" placeholder="WhatsApp Number">
                <textarea id="cAddr" placeholder="Full Address" rows="2"></textarea>
                <input type="text" id="model" placeholder="Device Model & IMEI">
                <input type="number" id="mrp" placeholder="Price (₹)">
                <input type="number" id="paid" placeholder="Advance (₹)">
                <button class="btn" onclick="save()">Save & Print</button>
            </div>
        </div>
        <div id="ledgerPage" style="display:none;"><div id="ledgerList"></div></div>
    </div>
</div>

<script>
    // Service Worker Register (Lite APK Jugad)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('data:text/javascript,self.addEventListener("fetch", (e) => { e.respondWith(fetch(e.request)); });');
    }

    const stores = { "nova1": { name: "NOVA DIGITAL WORLD", pass: "nova123", addr: "Mumbai, India", contact: "9876543210", ig: "novadigital" } };
    let currentUser = null;

    function handleLogin() {
        let u = document.getElementById('user').value;
        let p = document.getElementById('pass').value;
        if(stores[u] && stores[u].pass === p) { localStorage.setItem('session', u); login(u); }
        else { alert("Wrong ID/Pass"); }
    }

    function login(u) {
        currentUser = u;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('displayShopName').innerText = stores[u].name;
        setInterval(() => { document.getElementById('liveClock').innerText = new Date().toLocaleString(); }, 1000);
    }

    function switchTab(t) {
        document.getElementById('billingPage').style.display = (t === 'billing' ? 'block' : 'none');
        document.getElementById('ledgerPage').style.display = (t === 'ledger' ? 'block' : 'none');
    }

    async function save() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        let shop = stores[currentUser];
        let name = document.getElementById('cName').value;

        // --- Watermark (Pura Beech mein Teda) ---
        doc.setTextColor(230, 230, 230); // Light Grey
        doc.setFontSize(50);
        doc.text(shop.name, 105, 150, { align: 'center', angle: 45 }); // Beech mein teda
        
        // --- Header ---
        doc.setFillColor(0, 31, 63); doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(197, 160, 89); doc.setFontSize(22); doc.text(shop.name, 105, 18, {align: 'center'});
        doc.setTextColor(255); doc.setFontSize(10); doc.text(shop.addr + " | " + shop.contact, 105, 28, {align: 'center'});

        // --- Bill Content ---
        doc.setTextColor(0); doc.setFontSize(12);
        doc.text(`Customer: ${name}`, 20, 60);
        doc.text(`Device: ${document.getElementById('model').value}`, 20, 70);
        doc.text(`Price: Rs. ${document.getElementById('mrp').value}`, 20, 80);
        
        doc.save(name + "_Bill.pdf");
    }

    window.onload = () => { if(localStorage.getItem('session')) login(localStorage.getItem('session')); };
</script>
</body>
</html>
