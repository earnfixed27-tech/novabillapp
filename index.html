<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Enterprise - Professional Billing</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --main: #001f3f; --gold: #c5a059; --accent: #007bff; --bg: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: #333; }
        
        /* Login Styles */
        #loginPage { position: fixed; inset: 0; background: var(--main); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-card { background: white; padding: 40px; border-radius: 20px; text-align: center; width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        
        /* Header */
        .header { background: linear-gradient(135deg, #001f3f 0%, #003366 100%); color: white; padding: 30px; text-align: center; border-bottom: 5px solid var(--gold); }
        .container { max-width: 900px; margin: 20px auto; padding: 15px; }
        
        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #ddd; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .tab-btn.active { background: var(--main); color: white; }
        
        /* Common UI */
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        label { font-size: 12px; font-weight: bold; color: #666; text-transform: uppercase; margin-bottom: 5px; display: block; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #ddd; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 5px; }
        .btn-blue { background: var(--main); color: white; }
        .btn-green { background: #28a745; color: white; }
        
        /* Search & Ledger */
        .search-box { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .ledger-item { border-left: 5px solid var(--main); background: #f9f9f9; padding: 15px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .status-badge { padding: 4px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; }
        .paid { background: #d4edda; color: #155724; }
        .due { background: #f8d7da; color: #721c24; }
        
        #appContent { display: none; }
    </style>
</head>
<body>

<div id="loginPage">
    <div class="login-card">
        <h2 style="color:var(--main)">OWNER LOGIN</h2>
        <input type="text" id="username" placeholder="Username (admin)">
        <input type="password" id="password" placeholder="Password (nova123)">
        <button class="btn btn-blue" onclick="checkLogin()">Enter Store</button>
    </div>
</div>

<div id="appContent">
    <div class="header">
        <h1>NOVA DIGITAL STORE</h1>
        <p>Premium Enterprise Billing Solution</p>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('bill')">New Billing</button>
            <button class="tab-btn" onclick="showTab('history')">Ledger / History</button>
        </div>

        <div id="tab_bill">
            <div class="card">
                <h2>Customer Details</h2>
                <div class="grid">
                    <div><label>Name</label><input type="text" id="cName"></div>
                    <div><label>WhatsApp</label><input type="number" id="cPhone"></div>
                </div>
                <div class="grid">
                    <div><label>GST No.</label><input type="text" id="gst"></div>
                    <div><label>Instagram ID</label><input type="text" id="insta"></div>
                </div>
            </div>

            <div class="card">
                <h2>Product & Warranty</h2>
                <div class="grid">
                    <div>
                        <label>Brand</label>
                        <select id="brand">
                            <option>Samsung</option><option>iPhone</option>
                            <option>Vivo</option><option>Oppo</option><option>Realme</option>
                        </select>
                    </div>
                    <div><label>Model</label><input type="text" id="model"></div>
                </div>
                <div class="grid">
                    <div><label>IMEI</label><input type="number" id="imei"></div>
                    <div><label>Warranty (Months)</label><input type="number" id="warranty" value="12"></div>
                </div>
            </div>

            <div class="card">
                <h2>Payment</h2>
                <div class="grid">
                    <div><label>Price (₹)</label><input type="number" id="mrp" onkeyup="calc()"></div>
                    <div><label>Paid (₹)</label><input type="number" id="paid" onkeyup="calc()"></div>
                </div>
                <h3 id="balDisp" style="color:red; text-align:center;">Balance: ₹0</h3>
                <button class="btn btn-blue" onclick="saveAndPrint()">Download Pro Invoice</button>
                <button class="btn btn-green" onclick="shareWA()">Send on WhatsApp</button>
            </div>
        </div>

        <div id="tab_history" style="display:none;">
            <div class="search-box">
                <input type="text" id="search" placeholder="Search by name or number..." onkeyup="loadHistory()">
                <div style="display:flex; gap:10px;">
                    <button class="tab-btn" onclick="filterHistory('ALL')">All</button>
                    <button class="tab-btn" onclick="filterHistory('DUE')">Udhari (Due)</button>
                    <button class="tab-btn" onclick="filterHistory('PAID')">Paid</button>
                </div>
            </div>
            <div id="historyList"></div>
        </div>
    </div>
</div>

<script>
    let filter = 'ALL';

    function checkLogin() {
        if(document.getElementById('username').value === 'admin' && document.getElementById('password').value === 'nova123') {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
        } else { alert('Wrong Credentials'); }
    }

    function showTab(t) {
        document.getElementById('tab_bill').style.display = (t === 'bill') ? 'block' : 'none';
        document.getElementById('tab_history').style.display = (t === 'history') ? 'block' : 'none';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if(t === 'history') { loadHistory(); document.querySelectorAll('.tab-btn')[1].classList.add('active'); }
        else { document.querySelectorAll('.tab-btn')[0].classList.add('active'); }
    }

    function calc() {
        let m = parseFloat(document.getElementById('mrp').value) || 0;
        let p = parseFloat(document.getElementById('paid').value) || 0;
        document.getElementById('balDisp').innerText = "Balance: ₹" + (m - p);
    }

    function saveAndPrint() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        let data = {
            id: Date.now(),
            name: document.getElementById('cName').value,
            phone: document.getElementById('cPhone').value,
            model: document.getElementById('model').value,
            brand: document.getElementById('brand').value,
            imei: document.getElementById('imei').value,
            mrp: parseFloat(document.getElementById('mrp').value) || 0,
            paid: parseFloat(document.getElementById('paid').value) || 0,
            date: new Date().toLocaleDateString(),
            wMonths: parseInt(document.getElementById('warranty').value) || 0
        };

        // Automatic Warranty Date
        let expiry = new Date();
        expiry.setMonth(expiry.getMonth() + data.wMonths);
        data.expiryDate = expiry.toLocaleDateString();

        // Save to LocalStorage
        let history = JSON.parse(localStorage.getItem('nova_db')) || [];
        history.push(data);
        localStorage.setItem('nova_db', JSON.stringify(history));

        // Generate PDF
        doc.setFillColor(0, 31, 63); doc.rect(0, 0, 210, 45, 'F');
        
        // Watermark
        doc.setTextColor(240, 240, 240); doc.setFontSize(40);
        doc.text("NOVA DIGITAL STORE", 30, 150, {angle: 45});

        doc.setTextColor(197, 160, 89); doc.setFontSize(24);
        doc.text("NOVA DIGITAL STORE", 105, 20, {align: 'center'});
        doc.setTextColor(255, 255, 255); doc.setFontSize(10);
        doc.text("PREMIUM AUTHORIZED TAX INVOICE", 105, 30, {align: 'center'});

        doc.setTextColor(0,0,0); doc.setFontSize(10);
        doc.text(`Invoice No: INV-${data.id.toString().slice(-6)}`, 20, 55);
        doc.text(`Date: ${data.date}`, 150, 55);

        doc.setFont("helvetica", "bold"); doc.text("CUSTOMER DETAILS", 20, 70);
        doc.setFont("helvetica", "normal");
        doc.text(`Name: ${data.name}`, 20, 80);
        doc.text(`Contact: ${data.phone}`, 20, 90);

        doc.line(20, 95, 190, 95);
        doc.setFont("helvetica", "bold"); doc.text("PRODUCT & WARRANTY", 20, 105);
        doc.setFont("helvetica", "normal");
        doc.text(`Device: ${data.brand} ${data.model}`, 20, 115);
        doc.text(`IMEI: ${data.imei}`, 20, 125);
        doc.setTextColor(0, 100, 0);
        doc.text(`Warranty Period: ${data.date} TO ${data.expiryDate}`, 20, 135);

        doc.setTextColor(0,0,0);
        doc.setFillColor(245, 245, 245); doc.rect(130, 145, 60, 35, 'F');
        doc.text(`Total Price: Rs. ${data.mrp}`, 135, 155);
        doc.text(`Paid Amt: Rs. ${data.paid}`, 135, 165);
        doc.setFont("helvetica", "bold");
        doc.text(`BALANCE: Rs. ${data.mrp - data.paid}`, 135, 175);

        doc.text("___________________", 20, 250); doc.text("Owner Signature", 20, 260);
        doc.text("___________________", 140, 250); doc.text("Customer Signature", 140, 260);

        doc.save(`${data.name}_Invoice.pdf`);
    }

    function loadHistory() {
        let db = JSON.parse(localStorage.getItem('nova_db')) || [];
        let search = document.getElementById('search').value.toLowerCase();
        let list = document.getElementById('historyList');
        list.innerHTML = "";

        db.reverse().forEach(x => {
            let bal = x.mrp - x.paid;
            let status = (bal > 0) ? 'DUE' : 'PAID';
            
            if(filter !== 'ALL' && filter !== status) return;
            if(!x.name.toLowerCase().includes(search) && !x.phone.includes(search)) return;

            list.innerHTML += `
                <div class="ledger-item">
                    <div>
                        <b>${x.name}</b> (${x.date})<br>
                        <small>${x.brand} ${x.model}</small>
                    </div>
                    <div style="text-align:right">
                        <span class="status-badge ${status.toLowerCase()}">${status}</span><br>
                        <b>₹${bal}</b>
                    </div>
                </div>
            `;
        });
    }

    function filterHistory(f) { filter = f; loadHistory(); }

    function shareWA() {
        let n = document.getElementById('cName').value;
        let p = document.getElementById('cPhone').value;
        let m = document.getElementById('mrp').value;
        let paid = document.getElementById('paid').value;
        let bal = m - paid;
        let msg = `*NOVA DIGITAL STORE*%0A---%0A*Name:* ${n}%0A*Total:* ₹${m}%0A*Balance:* ₹${bal}%0A*Warranty:* 1 Year%0A---%0A_Thank you for visiting!_`;
        window.open(`https://wa.me/91${p}?text=${msg}`, '_blank');
    }
</script>

</body>
</html>
