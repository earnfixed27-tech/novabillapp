<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>AAO SAI MOBILE | Premium Suite</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #0f172a; overflow-x: hidden; }
        .glass-header { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); }
        .premium-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; transition: 0.3s; }
        .tab-active { background: #2563eb; color: white; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
        #loginScreen { background: radial-gradient(circle at top right, #1e293b, #0f172a); }
    </style>
</head>
<body class="no-scrollbar">

<div id="loginScreen" class="fixed inset-0 z-[10000] flex items-center justify-center p-6">
    <div class="w-full max-w-sm bg-white/10 backdrop-blur-xl p-8 rounded-[32px] border border-white/20 shadow-2xl text-center">
        <h2 class="text-white text-2xl font-bold mb-2">AAO SAI MOBILE</h2>
        <p class="text-slate-400 text-sm mb-8">Premium Cloud Billing</p>
        <input type="text" id="user" placeholder="Shop ID" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 text-white outline-none">
        <input type="password" id="pass" placeholder="Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-8 text-white outline-none">
        <button onclick="handleLogin()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-xl">SIGN IN</button>
    </div>
</div>

<div id="mainApp" class="hidden h-screen flex flex-col">
    <header class="glass-header fixed top-0 w-full p-6 pt-12 text-white flex justify-between items-center z-50 rounded-b-[32px] shadow-2xl">
        <h1 class="text-lg font-extrabold tracking-tight uppercase">AAO SAI MOBILE</h1>
        <button onclick="handleLogout()" class="bg-red-500/20 text-red-400 px-4 py-2 rounded-xl text-xs font-bold border border-red-500/30">LOGOUT</button>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pt-36 pb-28 no-scrollbar">
        <div id="billingPage" class="space-y-6">
            <div class="premium-card p-6 shadow-sm space-y-4 border border-blue-100">
                <input type="text" id="cName" placeholder="Customer Name" class="w-full p-4 bg-slate-50 rounded-2xl outline-none">
                <input type="number" id="cPhone" placeholder="WhatsApp Number" class="w-full p-4 bg-slate-50 rounded-2xl outline-none">
                <div class="grid grid-cols-2 gap-3">
                    <select id="brand" class="p-4 bg-slate-50 rounded-2xl font-semibold"><option>Vivo</option><option>Oppo</option><option>Samsung</option><option>iPhone</option></select>
                    <input type="text" id="modelName" placeholder="Model" class="p-4 bg-slate-50 rounded-2xl outline-none">
                </div>
                <input type="text" id="imeiNo" placeholder="IMEI Number" class="w-full p-4 bg-slate-50 rounded-2xl outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-900 p-4 rounded-[20px]">
                        <p class="text-[10px] text-slate-400 font-bold uppercase">Total</p>
                        <input type="number" id="total" onkeyup="calc()" class="bg-transparent w-full text-white text-xl font-black outline-none" value="0">
                    </div>
                    <div class="bg-blue-600 p-4 rounded-[20px]">
                        <p class="text-[10px] text-blue-200 font-bold uppercase">Paid</p>
                        <input type="number" id="paid" onkeyup="calc()" class="bg-transparent w-full text-white text-xl font-black outline-none" value="0">
                    </div>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-dashed border-slate-300">
                    <p class="text-[10px] font-bold text-slate-500 uppercase mb-2">EMI Setup (Optional)</p>
                    <div class="flex gap-2">
                        <input type="number" id="emiAmt" placeholder="EMI Amt (e.g. 1000)" class="flex-1 p-2 bg-white rounded-lg text-sm border">
                        <input type="number" id="emiMonths" placeholder="Months" class="w-20 p-2 bg-white rounded-lg text-sm border">
                    </div>
                </div>
                <div class="bg-red-50 p-5 rounded-[24px] flex justify-between items-center border border-red-100">
                    <span class="text-red-600 font-bold">Balance Due</span>
                    <span class="text-2xl font-black text-red-600">₹<span id="bal">0</span></span>
                </div>
                <button onclick="saveBill()" class="w-full bg-blue-600 text-white py-5 rounded-[24px] font-extrabold text-lg shadow-2xl active:scale-95 transition-all">GENERATE & SEND WHATSAPP</button>
            </div>
        </div>

        <div id="ledgerPage" class="hidden space-y-4">
            <input type="text" id="ledgerSearch" onkeyup="renderLedger()" placeholder="Search Name or IMEI..." class="w-full p-5 rounded-3xl premium-card border-none shadow-md outline-none">
            <div id="ledgerList" class="space-y-4"></div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 glass-header rounded-[32px] flex items-center px-4 shadow-2xl z-50 border border-white/10">
        <button onclick="tab('billing')" id="t1" class="flex-1 flex flex-col items-center justify-center tab-item tab-active h-14"><span class="text-[10px] font-black uppercase">Billing</span></button>
        <button onclick="tab('ledger')" id="t2" class="flex-1 flex flex-col items-center justify-center tab-item text-slate-400 h-14"><span class="text-[10px] font-black uppercase">Ledger</span></button>
    </nav>
</div>

<div id="emiModal" class="hidden fixed inset-0 z-[10001] bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-6">
    <div class="w-full max-w-sm bg-white rounded-[40px] p-8 shadow-2xl">
        <h3 id="mName" class="text-2xl font-black text-slate-900 mb-1">Update</h3>
        <p id="mHistory" class="text-sm text-slate-500 mb-6"></p>
        <div class="flex gap-2 mb-6">
            <button onclick="window.open('tel:' + window.currentActiveData.phone)" class="flex-1 bg-blue-100 text-blue-600 py-3 rounded-2xl font-bold">📞 CALL</button>
            <button onclick="sendWhatsAppReminder()" class="flex-1 bg-green-100 text-green-600 py-3 rounded-2xl font-bold">💬 SMS</button>
        </div>
        <div class="space-y-4 mb-6">
            <button onclick="addFixedEMI(1000)" id="autoEmiBtn" class="w-full bg-slate-100 text-slate-700 py-3 rounded-2xl font-bold border border-slate-200">➕ Add Monthly EMI (₹1000)</button>
            <input type="number" id="addAmt" class="w-full p-4 bg-slate-50 rounded-2xl text-2xl font-black outline-none border" placeholder="Manual Amt">
        </div>
        <button onclick="updatePayment()" class="w-full bg-green-600 text-white py-5 rounded-3xl font-extrabold">UPDATE & PRINT PDF</button>
        <button onclick="closeModal()" class="w-full py-4 text-slate-400 font-bold mt-2">Close</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDKpOGpcFE1hiSGvuqLwIFtwHJZdxTSuTI",
        authDomain: "aaosai-3b241.firebaseapp.com",
        databaseURL: "https://aaosai-3b241-default-rtdb.firebaseio.com",
        projectId: "aaosai-3b241",
        storageBucket: "aaosai-3b241.firebasestorage.app",
        messagingSenderId: "731218123050",
        appId: "1:731218123050:web:3758dddce80efd5d8d6653",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CONFIG = { aaosai: { name: "AAO SAI MOBILE", pass: "aaosai7143", addr: "Rathi Complex Maghe Shop Mangrulpir", contact: "9145217143" } };
    let currentStore = 'aaosai', activeId = null;

    window.handleLogin = () => {
        let u = document.getElementById('user').value, p = document.getElementById('pass').value;
        if(CONFIG[u] && CONFIG[u].pass === p) { localStorage.setItem('aaosai_user', u); startApp(u); } else { alert("Error!"); }
    };

    window.handleLogout = () => { localStorage.removeItem('aaosai_user'); location.reload(); };

    window.startApp = (u) => {
        currentStore = u; document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        renderLedger();
    };

    window.calc = () => { document.getElementById('bal').innerText = (document.getElementById('total').value || 0) - (document.getElementById('paid').value || 0); };
    window.tab = (x) => {
        document.getElementById('billingPage').classList.toggle('hidden', x!='billing');
        document.getElementById('ledgerPage').classList.toggle('hidden', x!='ledger');
        document.getElementById('t1').classList.toggle('tab-active', x=='billing');
        document.getElementById('t2').classList.toggle('tab-active', x=='ledger');
    };

    window.saveBill = async () => {
        const name = document.getElementById('cName').value, phone = document.getElementById('cPhone').value;
        const total = parseFloat(document.getElementById('total').value || 0), paid = parseFloat(document.getElementById('paid').value || 0);
        const emiAmt = document.getElementById('emiAmt').value || 1000;
        
        const entry = {
            name, phone, brand: document.getElementById('brand').value, model: document.getElementById('modelName').value,
            imei: document.getElementById('imeiNo').value, total, emiSetting: emiAmt,
            payments: [{amt: paid, date: new Date().toLocaleDateString()}],
            date: new Date().toLocaleDateString(), timestamp: Date.now()
        };

        await set(push(ref(db, `shops/${currentStore}/bills`)), entry);
        printPDF(entry);

        // WhatsApp with Direct Download Link/Info
        const msg = `Hello ${name}, Your bill from AAO SAI MOBILE is ready.\nDevice: ${entry.brand} ${entry.model}\nTotal: Rs.${total}\nPaid: Rs.${paid}\nBalance: Rs.${total-paid}\nEMI: Rs.${emiAmt}/Month.`;
        window.open(`https://wa.me/91${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        location.reload();
    };

    window.renderLedger = () => {
        onValue(ref(db, `shops/${currentStore}/bills`), (snap) => {
            const list = document.getElementById('ledgerList'); list.innerHTML = "";
            const data = snap.val(); if(!data) return;
            Object.keys(data).reverse().forEach(key => {
                const i = data[key], tp = i.payments.reduce((a, b) => a + b.amt, 0), bal = i.total - tp;
                list.innerHTML += `<div onclick="openEmi('${key}', ${JSON.stringify(i).replace(/"/g, '&quot;')})" class="premium-card p-5 flex justify-between items-center shadow-sm">
                    <div><h4 class="font-bold">${i.name}</h4><p class="text-[10px] font-bold text-slate-400 uppercase">${i.brand} | ${i.date}</p></div>
                    <div class="text-right"><p class="text-lg font-black ${bal > 0 ? 'text-red-500' : 'text-green-600'}">₹${bal}</p></div>
                </div>`;
            });
        });
    };

    window.openEmi = (key, data) => {
        activeId = key; window.currentActiveData = data;
        const tp = data.payments.reduce((a, b) => a + b.amt, 0);
        document.getElementById('mName').innerText = data.name;
        document.getElementById('mHistory').innerText = `Balance Due: ₹${data.total - tp}`;
        document.getElementById('autoEmiBtn').innerText = `➕ Add EMI (₹${data.emiSetting || 1000})`;
        document.getElementById('emiModal').style.display = 'flex';
    };

    window.addFixedEMI = (amt) => { document.getElementById('addAmt').value = window.currentActiveData.emiSetting || amt; };

    window.sendWhatsAppReminder = () => {
        const d = window.currentActiveData, tp = d.payments.reduce((a, b) => a + b.amt, 0), bal = d.total - tp;
        const msg = `EMI Reminder AAO SAI MOBILE: Dear ${d.name}, your EMI of Rs.${d.emiSetting || 1000} is due. Total Balance: Rs.${bal}. Please visit the shop. Thank you!`;
        window.open(`https://wa.me/91${d.phone}?text=${encodeURIComponent(msg)}`, '_blank');
    };

    window.updatePayment = async () => {
        const amt = parseFloat(document.getElementById('addAmt').value || 0), data = window.currentActiveData;
        data.payments.push({amt, date: new Date().toLocaleDateString()});
        await update(ref(db, `shops/${currentStore}/bills/${activeId}`), { payments: data.payments });
        printPDF(data); closeModal();
    };

    window.closeModal = () => { document.getElementById('emiModal').style.display = 'none'; };

    function printPDF(c) {
        const { jsPDF } = window.jspdf; const doc = new jsPDF(); const conf = CONFIG[currentStore];
        const tp = c.payments.reduce((a, b) => a + b.amt, 0), bal = c.total - tp;
        doc.setFillColor(15, 23, 42); doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(255); doc.setFontSize(22); doc.text(conf.name, 20, 25);
        doc.setTextColor(0); doc.setFontSize(10);
        doc.text(`Customer: ${c.name} | Phone: ${c.phone}`, 20, 60);
        doc.text(`Device: ${c.brand} ${c.model} | IMEI: ${c.imei}`, 20, 70);
        doc.text(`Total Price: Rs.${c.total} | Total Paid: Rs.${tp}`, 20, 80);
        doc.setFontSize(14); doc.setTextColor(220, 38, 38);
        doc.text(`BALANCE DUE: Rs.${bal}`, 20, 95);
        doc.save(`Bill_${c.name}.pdf`);
    }

    window.onload = () => { if(localStorage.getItem('aaosai_user')) startApp(localStorage.getItem('aaosai_user')); };
</script>
</body>
</html>
