<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

    <title>Nova Bill Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --main: #001f3f; --gold: #c5a059; }
        body { font-family: sans-serif; margin: 0; background: #f0f4f8; height: 100vh; overflow: hidden; }
        
        /* Dashboard Header */
        .header { background: var(--main); color: white; padding: 20px; text-align: center; border-bottom: 5px solid var(--gold); }
        
        #loginScreen { position: fixed; inset: 0; background: var(--main); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 280px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; background: var(--main); color: white; cursor: pointer; text-transform: uppercase; }

        /* Custom Install Banner (Jar Auto nahi ala tar ha nakki disel) */
        #manualInstall { display: none; position: fixed; top: 0; left: 0; right: 0; background: #ffcc00; color: #000; padding: 10px; text-align: center; font-size: 14px; font-weight: bold; z-index: 10001; }
    </style>
</head>
<body>

<div id="manualInstall" onclick="triggerInstall()">
    🚀 Tap here to Install NovaBill App (Full Screen)
</div>

<div id="loginScreen">
    <div class="login-box">
        <h2 style="color:var(--main)">OWNER LOGIN</h2>
        <input type="text" id="user" placeholder="Shop ID" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ccc;">
        <input type="password" id="pass" placeholder="Password" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ccc;">
        <button class="btn" onclick="handleLogin()">Login & Save App</button>
    </div>
</div>

<div id="mainApp" style="display:none; flex-direction:column; height:100vh;">
    <div class="header">
        <h1 id="shopDisp" style="margin:0; font-size: 20px;">SHOP NAME</h1>
    </div>
    <div style="padding: 20px; text-align: center;">
        <h3>Standalone Mode Active</h3>
        <p>Ata link gayab hoil!</p>
    </div>
</div>

<script>
    let deferredPrompt;
    const manualInstall = document.getElementById('manualInstall');

    // Browser che default install trigger pakadne
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        manualInstall.style.display = 'block'; // Varche yellow banner dakhavne
    });

    async function triggerInstall() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') { manualInstall.style.display = 'none'; }
            deferredPrompt = null;
        }
    }

    // Service Worker Internal Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swCode = 'self.addEventListener("fetch", (e) => { e.respondWith(fetch(e.request)); });';
            const blob = new Blob([swCode], { type: 'text/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob))
                .then(() => console.log("SW Registered"))
                .catch(err => console.log("SW Failed", err));
        });
    }

    const stores = { "nova1": { name: "NOVA DIGITAL WORLD", pass: "nova123" } };

    function handleLogin() {
        let u = document.getElementById('user').value, p = document.getElementById('pass').value;
        if(stores[u] && stores[u].pass === p) {
            localStorage.setItem('session', u);
            login(u);
        } else { alert("Wrong ID/Pass"); }
    }

    function login(u) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        document.getElementById('shopDisp').innerText = stores[u].name;
    }

    window.onload = () => { if(localStorage.getItem('session')) login(localStorage.getItem('session')); };
</script>
</body>
</html>
