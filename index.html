<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>AAO SAI MOBILE | Premium suite</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        :root { --main: #0f172a; --accent: #2563eb; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; }
        .dark-mode { background-color: #0f172a; color: white; }
        .light-mode { background-color: #f8fafc; color: #1e293b; }
        .premium-card { border-radius: 28px; transition: 0.3s; border: 1px solid rgba(0,0,0,0.1); }
        .dark-mode .premium-card { background: #1e293b; border-color: #334155; }
        .light-mode .premium-card { background: #ffffff; }
        .tab-active { background: #2563eb; color: white; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="light-mode no-scrollbar" id="bodyBody">

<div id="loginScreen" class="fixed inset-0 z-[10000] flex items-center justify-center p-6 bg-[#0f172a]">
    <div class="w-full max-w-sm bg-white/10 backdrop-blur-xl p-8 rounded-[32px] border border-white/10 text-center shadow-2xl">
        <img src="https://i.ibb.co/Lhb8Y6H/Whats-App-Image-2026-01-08-at-9-41-51-AM.jpg" class="w-24 h-24 rounded-full mx-auto mb-6 border-4 border-blue-500 shadow-lg">
        <h2 class="text-white text-2xl font-bold mb-8 uppercase tracking-widest">AAO SAI MOBILE</h2>
        <input type="text" id="user" placeholder="Shop ID" class="w-full bg-white/5 p-4 rounded-2xl mb-4 text-white outline-none border border-white/10 focus:border-blue-500">
        <input type="password" id="pass" placeholder="Password" class="w-full bg-white/5 p-4 rounded-2xl mb-8 text-white outline-none border border-white/10 focus:border-blue-500">
        <button onclick="handleLogin()" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition">SIGN IN</button>
    </div>
</div>

<div id="mainApp" class="hidden h-screen flex flex-col">
    <header class="fixed top-0 w-full p-6 pt-12 flex justify-between items-center z-50 rounded-b-[32px] shadow-2xl bg-[#0f172a] text-white">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/Lhb8Y6H/Whats-App-Image-2026-01-08-at-9-41-51-AM.jpg" class="w-10 h-10 rounded-full border border-blue-500">
            <div><h1 class="text-lg font-black tracking-tight uppercase">AAO SAI</h1><p id="timer" class="text-[8px] text-blue-400 font-bold"></p></div>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleTheme()" class="bg-white/10 p-2 rounded-xl">🌓</button>
            <button onclick="handleLogout()" class="bg-red-500/20 text-red-400 px-3 py-2 rounded-xl text-xs font-bold border border-red-500/20">LOGOUT</button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pt-36 pb-28 no-scrollbar">
        <div id="billingPage" class="space-y-6">
            <div class="premium-card p-6 shadow-xl space-y-4">
                <input type="text" id="cName" placeholder="Customer Name" class="w-full p-4 bg-slate-100 dark:bg-slate-800 rounded-2xl outline-none border border-transparent focus:border-blue-500">
                <input type="number" id="cPhone" placeholder="WhatsApp Number" class="w-full p-4 bg-slate-100 dark:bg-slate-800 rounded-2xl outline-none">
                <textarea id="cAddr" placeholder="Customer Address (Manual)" class="w-full p-4 bg-slate-100 dark:bg-slate-800 rounded-2xl outline-none border border-transparent focus:border-blue-500"></textarea>
                
                <div class="grid grid-cols-2 gap-3">
                    <select id="brand" class="p-4 bg-slate-100 dark:bg-slate-800 rounded-2xl font-bold border border-transparent focus:border-blue-500">
                        <option>Vivo</option><option>Oppo</option><option>Samsung</option><option>iPhone</option><option>Motorola</option><option>Realme</option><option value="manual">Other (Manual)</option>
                    </select>
                    <input type="text" id="modelName" placeholder="Model (Manual)" class="p-4 bg-slate-100 dark:bg-slate-800 rounded-2xl outline-none border border-transparent focus:border-blue-500">
                </div>
                <input type="text" id="imeiNo" placeholder="IMEI Number (Manual)" class="w-full p-4 bg-slate-100 dark:bg-slate-800 rounded-2xl outline-none border border-transparent focus:border-blue-500">
                
                <div class="bg-blue-600/10 p-5 rounded-[24px] border border-blue-500/20">
                    <p class="text-[10px] font-black uppercase text-blue-500 mb-4 tracking-widest text-center">EMI Business Calculator</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-[9px] font-bold text-slate-400 mb-1 uppercase">Total Price</p>
                            <input type="number" id="total" onkeyup="calcEMI()" class="w-full p-3 bg-white dark:bg-slate-700 rounded-xl font-black text-blue-600 outline-none" value="0">
                        </div>
                        <div>
                            <p class="text-[9px] font-bold text-slate-400 mb-1 uppercase">Down Payment</p>
                            <input type="number" id="paid" onkeyup="calcEMI()" class="w-full p-3 bg-white dark:bg-slate-700 rounded-xl font-black text-green-600 outline-none" value="0">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mt-4">
                        <div>
                            <p class="text-[9px] font-bold text-slate-400 mb-1 uppercase">Months</p>
                            <input type="number" id="emiMonths" onkeyup="calcEMI()" placeholder="Months" class="w-full p-3 bg-white dark:bg-slate-700 rounded-xl font-bold outline-none" value="10">
                        </div>
                        <div class="bg-blue-600 rounded-xl flex flex-col items-center justify-center">
                            <p class="text-[8px] text-blue-100 font-bold uppercase">Monthly EMI</p>
                            <p class="text-sm font-black text-white">₹ <span id="monthlyEmiDisp">0</span></p>
                        </div>
                    </div>
                </div>
                <div class="bg-red-50 dark:bg-red-500/10 p-5 rounded-[24px] flex justify-between items-center border border-red-100 dark:border-red-500/20">
                    <span class="text-red-600 font-black uppercase text-xs">Final Balance Due</span>
                    <span class="text-2xl font-black text-red-600">₹ <span id="bal">0</span></span>
                </div>
                <button onclick="saveBill()" class="w-full bg-blue-600 text-white py-5 rounded-[28px] font-black text-lg shadow-2xl active:scale-95 transition-all">GENERATE & SEND WHATSAPP</button>
            </div>
        </div>

        <div id="ledgerPage" class="hidden space-y-4">
            <input type="text" id="ledgerSearch" onkeyup="renderLedger()" placeholder="Search Name or IMEI..." class="w-full p-5 rounded-3xl premium-card border-none shadow-md outline-none dark:bg-slate-800">
            <div class="flex gap-2 p-1.5 bg-slate-200 dark:bg-slate-700 rounded-2xl shadow-inner">
                <button onclick="setFilter('all')" id="btnAll" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase f-btn tab-active">ALL</button>
                <button onclick="setFilter('pending')" id="btnPending" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase f-btn">EMI PENDING</button>
                <button onclick="setFilter('paid')" id="btnPaid" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase f-btn">SETTLED</button>
            </div>
            <button onclick="downloadMasterReport()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black shadow-lg">📥 DOWNLOAD DAILY BACKUP PDF</button>
            <div id="ledgerList" class="space-y-4"></div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-[#0f172a] rounded-[32px] flex items-center px-4 shadow-2xl z-50 border border-white/10">
        <button onclick="tab('billing')" id="t1" class="flex-1 flex flex-col items-center justify-center tab-item tab-active h-14 rounded-2xl transition"><span class="text-[10px] font-black uppercase tracking-widest">Billing</span></button>
        <button onclick="tab('ledger')" id="t2" class="flex-1 flex flex-col items-center justify-center tab-item text-slate-400 h-14 rounded-2xl transition ml-2"><span class="text-[10px] font-black uppercase tracking-widest">Ledger</span></button>
    </nav>
</div>

<div id="emiModal" class="hidden fixed inset-0 z-[10001] bg-slate-900/95 backdrop-blur-md flex items-center justify-center p-6">
    <div class="w-full max-w-sm bg-white dark:bg-slate-800 rounded-[40px] p-8 shadow-2xl border border-white/10">
        <h3 id="mName" class="text-2xl font-black mb-1">Update Payment</h3>
        <p id="mHistory" class="text-sm text-slate-500 mb-6"></p>
        <div class="flex gap-3 mb-8">
            <button onclick="window.open('tel:' + window.currentActiveData.phone)" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-500/20">📞 CALL</button>
            <button onclick="sendWhatsAppReminder()" class="flex-1 bg-green-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-green-500/20">💬 WHATSAPP</button>
        </div>
        <div class="bg-slate-100 dark:bg-slate-700 p-4 rounded-2xl mb-6">
            <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Add EMI Amount</p>
            <input type="number" id="addAmt" class="bg-transparent w-full text-3xl font-black outline-none" placeholder="0">
        </div>
        <button onclick="updatePayment()" class="w-full bg-blue-600 text-white py-5 rounded-3xl font-black shadow-xl">SAVE & PRINT INVOICE</button>
        <button onclick="closeModal()" class="w-full py-4 text-slate-400 font-bold mt-2">CLOSE</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDKpOGpcFE1hiSGvuqLwIFtwHJZdxTSuTI",
        authDomain: "aaosai-3b241.firebaseapp.com",
        databaseURL: "https://aaosai-3b241-default-rtdb.firebaseio.com",
        projectId: "aaosai-3b241",
        storageBucket: "aaosai-3b241.firebasestorage.app",
        messagingSenderId: "731218123050",
        appId: "1:731218123050:web:3758dddce80efd5d8d6653",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CONFIG = { aaosai: { name: "AAO SAI MOBILE", pass: "aaosai7143", addr: "Rathi Complex Maghe Shop Mangrulpir Washim", contact: "9145217143", insta: "aaosaimobile_" } };
    let currentStore = 'aaosai', activeId = null, currentFilter = 'all';

    window.toggleTheme = () => {
        const body = document.getElementById('bodyBody');
        body.classList.toggle('light-mode');
        body.classList.toggle('dark-mode');
    };

    window.handleLogin = () => {
        let u = document.getElementById('user').value, p = document.getElementById('pass').value;
        if(CONFIG[u] && CONFIG[u].pass === p) { localStorage.setItem('aaosai_user', u); startApp(u); } else { alert("Error!"); }
    };

    window.handleLogout = () => { localStorage.removeItem('aaosai_user'); location.reload(); };

    window.startApp = (u) => {
        currentStore = u; document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        setInterval(() => { document.getElementById('timer').innerText = new Date().toLocaleString(); }, 1000);
        renderLedger();
    };

    window.calcEMI = () => {
        const total = parseFloat(document.getElementById('total').value || 0);
        const paid = parseFloat(document.getElementById('paid').value || 0);
        const months = parseFloat(document.getElementById('emiMonths').value || 1);
        const bal = total - paid;
        document.getElementById('bal').innerText = bal;
        document.getElementById('monthlyEmiDisp').innerText = Math.round(bal / months);
    };

    window.tab = (x) => {
        document.getElementById('billingPage').classList.toggle('hidden', x!='billing');
        document.getElementById('ledgerPage').classList.toggle('hidden', x!='ledger');
        document.getElementById('t1').classList.toggle('tab-active', x=='billing');
        document.getElementById('t2').classList.toggle('tab-active', x=='ledger');
    };

    window.setFilter = (f) => {
        currentFilter = f;
        ['btnAll', 'btnPending', 'btnPaid'].forEach(id => document.getElementById(id).classList.remove('tab-active'));
        document.getElementById('btn' + f.charAt(0).toUpperCase() + f.slice(1)).classList.add('tab-active');
        renderLedger();
    };

    window.saveBill = async () => {
        const entry = {
            name: document.getElementById('cName').value,
            phone: document.getElementById('cPhone').value,
            addr: document.getElementById('cAddr').value || CONFIG[currentStore].addr,
            brand: document.getElementById('brand').value,
            model: document.getElementById('modelName').value,
            imei: document.getElementById('imeiNo').value,
            total: parseFloat(document.getElementById('total').value || 0),
            emiMonths: document.getElementById('emiMonths').value,
            payments: [{amt: parseFloat(document.getElementById('paid').value || 0), date: new Date().toLocaleDateString()}],
            date: new Date().toLocaleDateString(),
            timestamp: Date.now()
        };
        const billRef = push(ref(db, `shops/${currentStore}/bills`));
        await set(billRef, entry);
        printPDF(entry);
        
        const msg = `*AAO SAI MOBILE INVOICE*\n------------------\nDear ${entry.name}, Bill is ready.\nDevice: ${entry.brand} ${entry.model}\nBalance: ₹${entry.total - entry.payments[0].amt}\n------------------\nVisit Again!`;
        window.open(`https://wa.me/91${entry.phone}?text=${encodeURIComponent(msg)}`, '_blank');
        location.reload();
    };

    window.renderLedger = () => {
        const search = document.getElementById('ledgerSearch').value.toLowerCase();
        onValue(ref(db, `shops/${currentStore}/bills`), (snap) => {
            const list = document.getElementById('ledgerList'); list.innerHTML = "";
            const data = snap.val(); if(!data) return;
            Object.keys(data).reverse().forEach(key => {
                const i = data[key], tp = i.payments.reduce((a, b) => a + b.amt, 0), bal = i.total - tp;
                if(!i.name.toLowerCase().includes(search) && !i.imei.includes(search)) return;
                if(currentFilter === 'pending' && bal <= 0) return;
                if(currentFilter === 'paid' && bal > 0) return;

                list.innerHTML += `<div onclick="openEmi('${key}', ${JSON.stringify(i).replace(/"/g, '&quot;')})" class="premium-card p-6 flex justify-between items-center shadow-lg bg-white dark:bg-slate-800 mb-4">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-blue-500/10 rounded-2xl flex items-center justify-center font-black text-blue-600">${i.name[0]}</div>
                        <div><h4 class="font-bold text-slate-800 dark:text-white">${i.name}</h4><p class="text-[10px] font-black text-slate-400 uppercase">${i.brand} | ${i.date}</p></div>
                    </div>
                    <div class="text-right">
                        <p class="text-xl font-black ${bal > 0 ? 'text-red-500' : 'text-green-600'}">₹${bal}</p>
                        <span class="text-[9px] font-black uppercase px-3 py-1 rounded-full ${bal > 0 ? 'bg-red-500/10 text-red-500' : 'bg-green-500/10 text-green-600'}">${bal > 0 ? 'EMI PENDING' : 'SUCCESS'}</span>
                    </div>
                </div>`;
            });
        });
    };

    window.openEmi = (key, data) => {
        activeId = key; window.currentActiveData = data;
        const tp = data.payments.reduce((a, b) => a + b.amt, 0);
        document.getElementById('mName').innerText = data.name;
        document.getElementById('mHistory').innerText = `Total: ₹${data.total} | Pending: ₹${data.total - tp}`;
        document.getElementById('emiModal').style.display = 'flex';
    };

    window.sendWhatsAppReminder = () => {
        const d = window.currentActiveData, tp = d.payments.reduce((a, b) => a + b.amt, 0), bal = d.total - tp;
        const msg = `*EMI REMINDER - AAO SAI MOBILE*\nDear ${d.name}, your balance of ₹${bal} is pending for ${d.brand} ${d.model}. Please pay at shop to avoid late fees.`;
        window.open(`https://wa.me/91${d.phone}?text=${encodeURIComponent(msg)}`, '_blank');
    };

    window.updatePayment = async () => {
        const amt = parseFloat(document.getElementById('addAmt').value || 0), data = window.currentActiveData;
        data.payments.push({amt, date: new Date().toLocaleDateString()});
        await update(ref(db, `shops/${currentStore}/bills/${activeId}`), { payments: data.payments });
        printPDF(data); closeModal();
    };

    window.closeModal = () => { document.getElementById('emiModal').style.display = 'none'; };

    window.downloadMasterReport = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(22); doc.setTextColor(15, 23, 42); doc.text("AAO SAI MOBILE - MASTER BACKUP", 105, 20, {align: 'center'});
        onValue(ref(db, `shops/${currentStore}/bills`), (snap) => {
            const data = snap.val();
            const rows = [];
            Object.values(data).forEach(i => {
                const bal = i.total - i.payments.reduce((a,b)=>a+b.amt,0);
                rows.push([i.date, i.name, i.phone, i.total, bal]);
            });
            doc.autoTable({ head: [['Date', 'Name', 'Phone', 'Total Price', 'Remaining Balance']], body: rows, startY: 30, headStyles: {fillColor: [15, 23, 42]} });
            doc.save(`AAO_SAI_BACKUP_${new Date().toLocaleDateString()}.pdf`);
        });
    };

    function printPDF(c) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const conf = CONFIG[currentStore];
        const tp = c.payments.reduce((a, b) => a + b.amt, 0);
        const bal = c.total - tp;

        // PREMUM HEADER
        doc.setFillColor(15, 23, 42); doc.rect(0, 0, 210, 60, 'F');
        doc.addImage("https://i.ibb.co/Lhb8Y6H/Whats-App-Image-2026-01-08-at-9-41-51-AM.jpg", "JPEG", 20, 10, 35, 35);
        doc.setTextColor(255); doc.setFontSize(32); doc.setFont("helvetica", "bold"); doc.text(conf.name, 60, 25);
        doc.setFontSize(9); doc.text("Rathi Complex, Maghe Shop, Mangrulpir, Washim", 60, 35);
        doc.text("Mobile: +91 " + conf.contact, 60, 42);

        // WATERMARK
        doc.setTextColor(242); doc.setFontSize(60); doc.text("AAO SAI MOBILE", 105, 150, {align:'center', angle:45});

        // INVOICE DETAILS
        doc.setTextColor(0); doc.setFontSize(10); doc.text("INVOICE TO:", 20, 75);
        doc.setFontSize(16); doc.setFont("helvetica", "bold"); doc.text(c.name, 20, 85);
        doc.setFontSize(10); doc.setFont("helvetica", "normal"); doc.text("Phone: +91 " + c.phone, 20, 93);
        doc.text("Invoice Date: " + c.date, 150, 75);

        // BADGES
        const badgeColor = bal > 0 ? [220, 38, 38] : [22, 163, 74];
        doc.setFillColor(...badgeColor); doc.rect(150, 82, 40, 10, 'F');
        doc.setTextColor(255); doc.setFontSize(9); doc.text(bal > 0 ? "EMI PENDING" : "SUCCESS FULL PAID", 170, 88.5, {align: 'center'});

        // PRODUCT TABLE
        doc.autoTable({
            startY: 105,
            head: [['Description', 'IMEI Number', 'Total Price']],
            body: [[c.brand + " " + c.model, c.imei || "-", "Rs. " + c.total]],
            theme: 'grid', headStyles: {fillColor: [37, 99, 235]}
        });

        // FINAL TOTALS
        const finalY = doc.previousAutoTable.finalY + 15;
        doc.setTextColor(100); doc.setFontSize(11);
        doc.text("Gross Amount:", 130, finalY); doc.text("Rs. " + c.total, 175, finalY);
        doc.text("Total Paid:", 130, finalY + 8); doc.text("Rs. " + tp, 175, finalY + 8);
        doc.setFontSize(16); doc.setTextColor(220, 38, 38); doc.text("BALANCE DUE:", 130, finalY + 20); doc.text("Rs. " + bal, 175, finalY + 20);

        // SLOGAN & INSTA
        doc.setTextColor(150); doc.setFontSize(8); doc.text("Terms: No returns on mobile devices. Thank you!", 20, 220);
        
        let qrBox = document.createElement('div');
        new QRCode(qrBox, { text: "https://www.instagram.com/"+conf.insta, width: 80, height: 80 });
        setTimeout(() => {
            let canvas = qrBox.querySelector('canvas');
            if(canvas) { 
                doc.addImage(canvas.toDataURL("image/png"), 'PNG', 20, 240, 30, 30); 
                doc.setTextColor(50); doc.setFontSize(9); doc.text("Follow us: @" + conf.insta, 20, 275);
            }
            doc.line(140, 240, 190, 240); doc.text("Authorized Signature", 145, 245);
            doc.save(`Invoice_${c.name}.pdf`);
        }, 500);
    }

    window.onload = () => { if(localStorage.getItem('aaosai_user')) startApp(localStorage.getItem('aaosai_user')); };
</script>
</body>
</html>
